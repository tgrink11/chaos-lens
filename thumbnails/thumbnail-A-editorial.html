<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>1880 Quant Analyzer — Thumbnail A (Editorial)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .thumb {
    width: 1280px; height: 720px;
    position: relative;
    background: radial-gradient(ellipse at top right, #1e293b 0%, #0f172a 70%);
    overflow: hidden;
  }
  /* Subtle grid background */
  .thumb::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .pill {
    display: inline-flex; align-items: center;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="thumb flex">

  <!-- Left side — title -->
  <div class="relative flex-1 flex flex-col justify-center px-16 z-10">
    <div class="text-emerald-400 text-2xl font-bold tracking-widest mb-3 uppercase">Best of Us Investors</div>
    <h1 class="text-white font-bold leading-[1.0] mb-6" style="font-size: 96px; letter-spacing: -0.02em;">
      1880<br/>
      <span class="text-emerald-400">Quant</span><br/>
      Analyzer
    </h1>
    <p class="text-slate-300 text-2xl leading-snug max-w-md">
      How to read every stock's daily rating in 60 seconds
    </p>
  </div>

  <!-- Right side — rating matrix mockup -->
  <div class="relative w-[560px] flex flex-col justify-center pr-16 z-10">
    <div class="bg-white/95 rounded-2xl p-8 shadow-2xl">
      <div class="text-xs text-slate-500 uppercase tracking-widest font-semibold mb-4">Today's Ratings</div>
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">SPY</span>
          <span class="pill" style="background:#059669;color:white;">STRONG ACCUMULATION</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">AAPL</span>
          <span class="pill" style="background:#d1fae5;color:#065f46;">ACCUMULATING</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">DELL</span>
          <span class="pill" style="background:#dc2626;color:white;box-shadow:0 0 0 2px #991b1b;">DON'T CHASE</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">NVDA</span>
          <span class="pill" style="background:#ecfdf5;color:#047857;">BUILDING BASE</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">ZS</span>
          <span class="pill" style="background:#fee2e2;color:#991b1b;">DISTRIBUTION</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-700 font-mono font-bold text-lg">F</span>
          <span class="pill" style="background:#fef3c7;color:#92400e;">SPECULATIVE</span>
        </div>
      </div>
      <div class="mt-5 pt-4 border-t border-slate-200 text-center text-xs text-slate-500">
        One column. Eight ratings. Zero guesswork.
      </div>
    </div>
  </div>

  <!-- Bottom-right corner badge -->
  <div class="absolute bottom-6 right-8 text-slate-500 text-xs uppercase tracking-widest z-10 font-mono">
    Daily · Free · Subscriber-only
  </div>
</div>
</body>
</html>
