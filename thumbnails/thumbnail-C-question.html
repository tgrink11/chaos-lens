<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>1880 Quant Analyzer — Thumbnail C (Question)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .thumb {
    width: 1280px; height: 720px;
    position: relative;
    background:
      radial-gradient(circle at 80% 20%, rgba(5, 150, 105, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(220, 38, 38, 0.06) 0%, transparent 50%),
      #ffffff;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="thumb flex flex-col justify-between p-16">

  <!-- Top branding -->
  <div class="flex items-center gap-3">
    <div class="text-emerald-700 text-base font-black tracking-widest uppercase">Best of Us Investors</div>
    <div class="text-slate-300">·</div>
    <div class="text-slate-500 text-base uppercase tracking-widest font-bold">1880 Quant Analyzer</div>
  </div>

  <!-- Middle — big question + answer -->
  <div class="flex-1 flex flex-col justify-center">
    <h1 class="text-slate-900 font-black leading-[0.95]" style="font-size: 132px; letter-spacing: -0.04em;">
      <span class="text-slate-400">Buy?</span><br/>
      <span class="text-slate-400">Hold?</span><br/>
      <span class="text-emerald-600">Or run.</span>
    </h1>

    <p class="text-slate-600 text-3xl mt-6 max-w-3xl leading-snug">
      Every stock, every day, rated by the math —
      <span class="font-bold text-slate-900">not the noise.</span>
    </p>
  </div>

  <!-- Bottom — preview pills + CTA -->
  <div class="flex items-end justify-between">
    <div class="flex items-center gap-2 flex-wrap max-w-2xl">
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#059669;color:white;">STRONG ACCUMULATION</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#d1fae5;color:#065f46;">ACCUMULATING</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#ecfdf5;color:#047857;">BUILDING BASE</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#f1f5f9;color:#475569;">NO IDEA</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#fed7aa;color:#9a3412;">TOPPING</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#fee2e2;color:#991b1b;">DISTRIBUTION</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-bold" style="background:#fef3c7;color:#92400e;">SPECULATIVE</span>
      <span class="inline-flex items-center px-3 py-1.5 rounded text-sm font-black text-white" style="background:#dc2626;box-shadow:0 0 0 2px #991b1b;">DON'T CHASE</span>
    </div>

    <div class="text-right">
      <div class="text-slate-400 text-xs uppercase tracking-widest font-semibold">Walkthrough</div>
      <div class="text-slate-900 text-2xl font-bold">Watch ▶</div>
    </div>
  </div>

</div>
</body>
</html>
